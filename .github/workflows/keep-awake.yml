# Pings the Render site so the free server doesn't fall asleep.
# Remove this file (or disable it in the Actions tab) to let it sleep again.
name: Keep site awake
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 90 https://secret-hitler-table.onrender.com/ -o /dev/null || true
