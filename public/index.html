<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secret Hitler — table edition</title>
<link rel="stylesheet" href="/style.css">
<style>
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .box { max-width: 520px; text-align: center; }
  .emb { display: flex; gap: 14px; justify-content: center; } .emb img { width: 96px; border-radius: 8px; }
  a { display: block; margin: 14px 0; padding: 18px; border-radius: 12px; text-decoration: none; font-family: var(--head); letter-spacing: 0.08em; text-transform: uppercase; font-size: 1.2rem; }
  .tv { background: var(--paper); color: var(--ink); } .ph { background: var(--fas); color: var(--paper); }
  p { color: var(--muted); line-height: 1.6; }
</style>
</head>
<body>
<div class="box">
  <div class="emb"><img src="/assets/role-liberal-2.png" alt=""><img src="/assets/role-hitler.png" alt=""><img src="/assets/role-fascist-1.png" alt=""></div>
  <h1 style="font-size:2.4rem;margin:16px 0">Secret Hitler</h1>
  <a class="tv" href="/tv">Open the TV board</a>
  <a class="ph" href="/play">Join as a player</a>
  <p>Open the TV board on the big screen. Everyone else joins on their phone by scanning the QR code.</p>
  <p style="font-size:0.8rem">Fan-made adaptation of Secret Hitler by Goat, Wolf &amp; Cabbage. Art adapted from Secret Hitler Online by ShrimpCryptid. CC BY-NC-SA 4.0. Not for sale.</p>
</div>
</body>
</html>
